# Separate production topology. Supply .env.production from a secret manager.
# TLS terminates at an external ingress/load balancer. Do not expose the HTTP listener publicly.
name: contentflow-prod
x-app: &app
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile
    target: runtime
  env_file: ../.env.production
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt: ["no-new-privileges:true"]
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: build
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *app
    environment:
      NODE_ENV: production
      API_PORT: 3000
      WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:?HTTPS origin required}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/contentflow-worker-ready','utf8'))<20000?0:1)"]
      interval: 15s
      timeout: 3s
      retries: 5
  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: web-production
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
