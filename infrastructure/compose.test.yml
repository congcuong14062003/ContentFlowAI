# Disposable CI object storage. No application/database volumes are mounted here.
name: contentflow-test
services:
  storage:
    build:
      context: ..
      dockerfile: infrastructure/storage.Dockerfile
      target: server
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?required}
    ports: ["127.0.0.1:9000:9000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage-init:
    build:
      context: ..
      dockerfile: infrastructure/storage.Dockerfile
      target: client
    depends_on:
      storage: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
      S3_BUCKET: ${S3_BUCKET:?required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'mc alias set test http://storage:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null; mc mb --ignore-existing "test/$$S3_BUCKET"'
