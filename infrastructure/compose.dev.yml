name: contentflow-dev
x-app: &app
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile
    target: development
  env_file: ../.env
  init: true
  stop_grace_period: 30s
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:${REDIS_PORT:-56379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    build:
      context: ..
      dockerfile: infrastructure/storage.Dockerfile
      target: server
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    ports: ["127.0.0.1:${S3_PORT:-59000}:9000", "127.0.0.1:${S3_CONSOLE_PORT:-59001}:9001"]
    volumes: ["storage-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage-init:
    build:
      context: ..
      dockerfile: infrastructure/storage.Dockerfile
      target: client
    depends_on:
      storage: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'mc alias set local http://storage:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null; mc mb --ignore-existing "local/$$S3_BUCKET"'
  migrate:
    <<: *app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *app
    environment:
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://storage:9000
    command: ["npm", "run", "dev:api"]
    ports: ["127.0.0.1:${API_HOST_PORT:-3000}:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
  worker:
    <<: *app
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      MAIL_LOCAL_DIR: /app/.local/mail
    volumes: ["../.local/mail:/app/.local/mail"]
    command: ["npm", "run", "dev:worker"]
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/contentflow-worker-ready','utf8'))<20000?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 10
  web:
    <<: *app
    environment:
      API_PROXY_TARGET: http://api:3000
    command: ["npm", "run", "dev:web"]
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  redis-data:
  storage-data:
